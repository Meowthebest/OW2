name: Deploy Vite site to Pages

on:
  push:
    branches: [ main ]
  # The patch sync starts this after committing new data, because commits made by a workflow do not trigger push events.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run test:logic
      - run: npm run test:patches
      - run: npm run test:players
      - run: npm run test:worker
      - run: npm run test:timer
      - run: npm run test:ui
      - run: npm run build
        env:
          # Optional. Set this repository variable to your Cloudflare Worker URL to route
          # career data through it. When empty, the site calls OverFast API directly.
          VITE_CAREER_API_URL: ${{ vars.CAREER_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
